name: Rollback Database Migration

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Migration to rollback to (e.g., 20250617011053_add_phone_and_name_columns)'
        required: true
        type: string
      confirm:
        description: 'Type "CONFIRM" to proceed with rollback'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "Rollback not confirmed. Exiting."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See ci.yml's `deploy` job for why this pulls live from Vercel instead
      # of a duplicated GitHub secret.
      - name: Pull database credentials from Vercel
        run: |
          npx vercel env pull .env.ci --environment production --token="${{ secrets.VERCEL_TOKEN }}" --yes
          {
            grep '^DATABASE_URL=' .env.ci | sed -E 's/="(.*)"$/=\1/'
            grep '^DATABASE_URL_UNPOOLED=' .env.ci | sed -E 's/^DATABASE_URL_UNPOOLED="(.*)"$/DIRECT_URL=\1/'
          } >> "$GITHUB_ENV"
          rm .env.ci

      - name: Rollback migration

        run: |
          echo "Rolling back to migration: ${{ github.event.inputs.migration_name }}"
          npx prisma migrate resolve --rolled-back ${{ github.event.inputs.migration_name }}

      - name: Generate Prisma client
        run: npx prisma generate
